    <script>
      // Defensive guard against wallet extension conflicts (Cannot redefine property: ethereum)
      try {
        const originalDefineProperty = Object.defineProperty;
        Object.defineProperty = function(obj, prop, descriptor) {
          if (prop === 'ethereum' && obj === window && window.ethereum) {
            console.warn('Prevented redefinition of window.ethereum to avoid crash.');
            return obj;
          }
          return originalDefineProperty.apply(this, arguments);
        };
      } catch (e) {
        console.error('Failed to setup ethereum guard', e);
      }
    </script>
